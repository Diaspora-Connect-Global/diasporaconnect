# ============================================
# Nginx WebSocket Proxy Configuration
# ============================================
# Add this to your nginx configuration to proxy WebSocket connections
# to the message service running on port 5007

# Option 1: Add to existing location block
# ----------------------------------------
location / {
    # Your existing proxy settings...
    proxy_pass http://your-backend;

    # Add WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}

# Option 2: Dedicated /socket.io/ location (RECOMMENDED)
# --------------------------------------------------------
location /socket.io/ {
    # Proxy to message service (adjust based on your setup)
    # If using Docker Compose service name:
    proxy_pass http://message-service:5007;

    # If using localhost:
    # proxy_pass http://localhost:5007;

    # WebSocket upgrade headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for WebSocket
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    # Disable buffering for WebSocket
    proxy_buffering off;

    # Cache bypass
    proxy_cache_bypass $http_upgrade;
}

# ============================================
# Full Example Configuration
# ============================================
# If you need a complete example:

upstream backend {
    server backend-service:8000;  # Your GraphQL/REST API
}

upstream websocket {
    server message-service:5007;   # Your WebSocket service
}

server {
    listen 443 ssl http2;
    server_name diaspoplug.com;

    # SSL configuration
    ssl_certificate /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    # Main application
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint
    location /socket.io/ {
        proxy_pass http://websocket;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}

