<!DOCTYPE html>
<html>
<head>
    <title>Token Debug Helper</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        pre {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .token {
            word-break: break-all;
            color: #4ec9b0;
        }
        .warning {
            color: #ce9178;
        }
        .success {
            color: #4ec9b0;
        }
        .error {
            color: #f48771;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px 10px 0;
        }
        button:hover {
            background: #1177bb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 WebSocket Token Debugger</h1>
        <p>This tool helps you debug WebSocket authentication issues.</p>

        <button onclick="checkToken()">Check Auth Token</button>
        <button onclick="decodeToken()">Decode JWT Token</button>
        <button onclick="clearStorage()">Clear Session Storage</button>

        <div id="output"></div>
    </div>

    <script>
        function checkToken() {
            const output = document.getElementById('output');

            // Get auth store from session storage
            const authStore = sessionStorage.getItem('auth-store');

            if (!authStore) {
                output.innerHTML = '<pre class="error">❌ No auth-store found in sessionStorage</pre>';
                return;
            }

            try {
                const parsed = JSON.parse(authStore);
                const tokens = parsed.state?.tokens;

                if (!tokens) {
                    output.innerHTML = '<pre class="error">❌ No tokens found in auth-store</pre>';
                    return;
                }

                let html = '<h2>📊 Auth Store Contents:</h2>';
                html += '<pre>';
                html += `Session Token: ${tokens.sessionToken ? '<span class="success">✓ Present</span>' : '<span class="error">✗ Missing</span>'}\n`;
                html += `Access Token: ${tokens.accessToken ? '<span class="success">✓ Present</span>' : '<span class="error">✗ Missing</span>'}\n`;
                html += `Refresh Token: ${tokens.refreshToken ? '<span class="success">✓ Present</span>' : '<span class="error">✗ Missing</span>'}\n`;
                html += `Session ID: ${tokens.sessionId || '<span class="error">Missing</span>'}\n`;
                html += `\nExpiry Info:\n`;
                html += `Expires At: ${tokens.expiresAt ? new Date(tokens.expiresAt).toLocaleString() : 'Not set'}\n`;

                if (tokens.expiresAt) {
                    const now = Date.now();
                    const expiresAt = typeof tokens.expiresAt === 'string'
                        ? new Date(tokens.expiresAt).getTime()
                        : tokens.expiresAt;
                    const isExpired = now >= expiresAt;

                    if (isExpired) {
                        const expiredAgo = Math.floor((now - expiresAt) / 1000 / 60);
                        html += `<span class="error">❌ Token EXPIRED ${expiredAgo} minutes ago</span>\n`;
                    } else {
                        const expiresIn = Math.floor((expiresAt - now) / 1000 / 60);
                        html += `<span class="success">✓ Token valid for ${expiresIn} more minutes</span>\n`;
                    }
                }

                html += `\n<span class="warning">Token Preview (first 50 chars):</span>\n`;
                if (tokens.sessionToken) {
                    html += `<span class="token">${tokens.sessionToken.substring(0, 50)}...</span>\n`;
                    html += `Length: ${tokens.sessionToken.length} characters\n`;
                }

                html += '</pre>';
                output.innerHTML = html;

            } catch (error) {
                output.innerHTML = `<pre class="error">❌ Error parsing auth-store: ${error.message}</pre>`;
            }
        }

        function decodeToken() {
            const output = document.getElementById('output');
            const authStore = sessionStorage.getItem('auth-store');

            if (!authStore) {
                output.innerHTML = '<pre class="error">❌ No auth-store found</pre>';
                return;
            }

            try {
                const parsed = JSON.parse(authStore);
                const token = parsed.state?.tokens?.sessionToken;

                if (!token) {
                    output.innerHTML = '<pre class="error">❌ No sessionToken found</pre>';
                    return;
                }

                // Decode JWT (simple base64 decode, no validation)
                const parts = token.split('.');
                if (parts.length !== 3) {
                    output.innerHTML = '<pre class="error">❌ Invalid JWT format (should have 3 parts)</pre>';
                    return;
                }

                const header = JSON.parse(atob(parts[0]));
                const payload = JSON.parse(atob(parts[1]));

                let html = '<h2>🔓 Decoded JWT Token:</h2>';
                html += '<h3>Header:</h3>';
                html += '<pre>' + JSON.stringify(header, null, 2) + '</pre>';
                html += '<h3>Payload:</h3>';
                html += '<pre>' + JSON.stringify(payload, null, 2) + '</pre>';

                // Check expiration
                if (payload.exp) {
                    const now = Math.floor(Date.now() / 1000);
                    const isExpired = now >= payload.exp;
                    const expDate = new Date(payload.exp * 1000);

                    html += '<h3>Expiration:</h3><pre>';
                    html += `Expires: ${expDate.toLocaleString()}\n`;

                    if (isExpired) {
                        const expiredAgo = Math.floor((now - payload.exp) / 60);
                        html += `<span class="error">❌ EXPIRED ${expiredAgo} minutes ago</span>\n`;
                    } else {
                        const expiresIn = Math.floor((payload.exp - now) / 60);
                        html += `<span class="success">✓ Valid for ${expiresIn} more minutes</span>\n`;
                    }
                    html += '</pre>';
                }

                output.innerHTML = html;

            } catch (error) {
                output.innerHTML = `<pre class="error">❌ Error decoding token: ${error.message}</pre>`;
            }
        }

        function clearStorage() {
            if (confirm('This will clear your session storage and log you out. Continue?')) {
                sessionStorage.clear();
                document.getElementById('output').innerHTML = '<pre class="success">✓ Session storage cleared. Please refresh and sign in again.</pre>';
            }
        }

        // Auto-check on load
        window.onload = checkToken;
    </script>
</body>
</html>
